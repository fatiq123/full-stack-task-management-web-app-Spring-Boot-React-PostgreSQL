<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Task Created</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background-color: #2196F3;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 5px 5px 0 0;
        }
        .content {
            padding: 20px;
            border: 1px solid #ddd;
            border-top: none;
            border-radius: 0 0 5px 5px;
        }
        .task-details {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            margin: 15px 0;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #777;
        }
        .button {
            display: inline-block;
            background-color: #2196F3;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>New Task Created</h1>
    </div>
    <div class="content">
        <p>Hello <strong th:text="${username}">User</strong>,</p>
        
        <p>You have created a new task "<strong th:text="${taskTitle}">Task Title</strong>".</p>
        
        <div class="task-details">
            <h3>Task Details:</h3>
            <p><strong>Title:</strong> <span th:text="${taskTitle}">Task Title</span></p>
            <p><strong>Description:</strong> <span th:text="${taskDescription}">Task Description</span></p>
            <p><strong>Due Date:</strong> <span th:text="${dueDate}">Due Date</span></p>
            <p><strong>Priority:</strong> <span th:text="${taskPriority}">Priority</span></p>
        </div>
        
        <a th:href="${taskUrl}" href="#" class="button">View Task</a>
    </div>
    <div class="footer">
        <p>This is an automated message from Task Management App.</p>
        <p>&copy; 2025 Task Management App. All rights reserved.</p>
    </div>
</body>
</html>
